spark.master                            yarn
spark.submit.deployMode                 client
# Two-queue lab: Spark -> etl (40%/100%), Hive Tez -> bi (60%/100%).
# See conf/hadoop/capacity-scheduler.xml.
spark.yarn.queue                        etl

spark.eventLog.enabled                  true
spark.eventLog.dir                      hdfs://namenode:9000/spark-logs
spark.history.fs.logDirectory           hdfs://namenode:9000/spark-logs
spark.yarn.historyServer.address        spark-history:18080

spark.sql.warehouse.dir                 /user/hive/warehouse
spark.hadoop.hive.metastore.uris        thrift://hive-metastore:9083
spark.sql.hive.metastore.version        4.0.1
# `jars=path` reads Hive 4.0.1 client jars from the local hive-libs
# volume (staged by the hive-libs-init one-shot from apache/hive:4.0.1's
# /opt/hive/lib). Without this, `jars=maven` redownloads ~250 jars from
# Maven Central on every PySpark / spark-submit session start.
spark.sql.hive.metastore.jars           path
spark.sql.hive.metastore.jars.path      file:///opt/spark/hive-client-jars/*.jar
spark.sql.catalogImplementation         hive

# Iceberg REST catalog - decouples Spark's client version from the
# catalog server. This is how Cloudera/Databricks/Snowflake/Polaris-based
# stacks side-step the broken Spark<->Hive4-HMS Iceberg path
# (Spark bundles Hive 2.3 client, Hive 4 dropped get_table - see
# iceberg#12878 / HIVE-26537). The lab runs a tabulario/iceberg-rest
# container on port 8181 backed by Postgres + HDFS.
spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type          rest
spark.sql.catalog.iceberg.uri           http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse     hdfs://namenode:9000/user/iceberg
spark.sql.catalog.iceberg.io-impl       org.apache.iceberg.hadoop.HadoopFileIO

spark.driver.memory                     1g
spark.executor.memory                   1g
spark.executor.cores                    1
spark.executor.instances                1

spark.jars.ivy                          /tmp/.ivy2
spark.yarn.am.waitTime                  120s
