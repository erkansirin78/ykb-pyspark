[desktop]
http_host=0.0.0.0
http_port=8888
secret_key=this_is_not_a_real_secret_key_change_me
default_user=hue
default_hdfs_superuser=hadoop
django_debug_mode=false
http_500_debug_mode=false

[[database]]
engine=postgresql_psycopg2
host=postgres
port=5432
user=hue
password=hue
name=hue

[[auth]]
backend=desktop.auth.backend.AllowFirstUserDjangoBackend

[hadoop]
[[hdfs_clusters]]
[[[default]]]
fs_defaultfs=hdfs://namenode:9000
webhdfs_url=http://namenode:9870/webhdfs/v1
hadoop_conf_dir=/opt/hadoop/etc/hadoop
security_enabled=false

[[yarn_clusters]]
[[[default]]]
resourcemanager_host=resourcemanager
resourcemanager_port=8032
resourcemanager_api_url=http://resourcemanager:8088
proxy_api_url=http://resourcemanager:8088
history_server_api_url=http://mr-historyserver:19888
spark_history_server_url=http://spark-history:18080
submit_to=True

[beeswax]
hive_server_host=hiveserver2
hive_server_port=10000
hive_conf_dir=/opt/hive/conf
thrift_version=11
auth_username=hue
auth_password=hue

[notebook]
[[interpreters]]
[[[hive]]]
name=Hive
interface=hiveserver2
[[[sparksql]]]
name=SparkSql
interface=hiveserver2
[[[mysql]]]
name=Postgres
interface=sqlalchemy
options='{"url": "postgresql+psycopg2://hive:hive@postgres:5432/metastore"}'
